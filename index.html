  if (longestWord > maxTitleW) {
    titleFontPx = Math.max(12, Math.floor(titleFontPx * maxTitleW / longestWord));
    measureCtx.font = titleFont(titleFontPx);
  }
  const titleLines = wrapText(measureCtx, title, maxTitleW);
  const titleBandH = Math.round(titleLines.length * titleFontPx * 1.35) + PAD;
  return { titleFontPx, titleBandH, titleLines };
}

// Lay out at the tallest source height (highest quality), then shrink the row
// height if the result would exceed the browser's canvas limits.
function fitLayout(layoutFor, targetH) {
  let L = layoutFor(targetH);
  const sideScale = Math.min(EXPORT_MAX_SIDE / L.totalW, EXPORT_MAX_SIDE / L.totalH, 1);
  const areaScale = Math.sqrt(EXPORT_MAX_AREA / (L.totalW * L.totalH));
  const scale = Math.min(sideScale, areaScale, 1);
  if (scale < 1) L = layoutFor(Math.max(40, Math.floor(targetH * scale)));
  return L;
}

function newExportCanvas(w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = EXPORT_BG;
  ctx.fillRect(0, 0, w, h);
  return { canvas, ctx };
}

// Decode one image, draw it (plus its caption), then free it immediately —
// peak memory is one source bitmap plus the canvas, instead of all 80 at once
// (which caused later drawImage calls to silently fail / render blank).
async function drawExportImage(ctx, id, x, y, w, h) {
  const bmp = await createImageBitmap(state.images[id].blob);
  ctx.drawImage(bmp, x, y, w, h);
  bmp.close();
  const ann = state.images[id].annotation;
  if (ann && ann.text) drawBubble(ctx, ann, x, y, w, h);
}

// Apply the requested w/h, encode as JPEG and download it.
function downloadCanvas(canvas, filenameExtra, count) {
  const wantW = exportDim('exportWidth');
  const wantH = exportDim('exportHeight');
  if (wantW || wantH) {
    const resized = resizeCanvas(canvas, wantW, wantH, EXPORT_MAX_SIDE, EXPORT_MAX_AREA);
    if (resized !== canvas) {
      canvas.width = canvas.height = 0;  // release the full-size render
      canvas = resized;
    }
  }
  const outW = canvas.width, outH = canvas.height;

  // Highest quality JPEG
  canvas.toBlob((blob) => {
    if (!blob) {
      console.error('toBlob returned null. Canvas size:', outW, 'x', outH);
      showToast(`Export failed (canvas ${outW}×${outH} too large for browser)`);
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = `${nameSlug('ranking')}${filenameExtra}-${ts}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`Exported ${count} image${count === 1 ? '' : 's'} (${outW}×${outH})`);
  }, 'image/jpeg', 1.0);
}

function exportJPG() {
  return state.mode === 'tier' ? exportTierJPG() : exportListJPG();
}

// Exports show exactly what's on screen: images in hidden groups are left out.
async function exportListJPG() {
  const shown = visible(state.ranked);
  if (shown.length === 0) {
    showToast(state.ranked.length ? 'Every ranked image is in a hidden group' : 'Nothing ranked to export');
    return;
  }
  const limit = exportLimit();
  const ranked = limit ? shown.slice(0, limit) : shown;
  const PAD = EXPORT_PAD;

  const dims = await measureDims(ranked);
  // Uniform height = tallest source image (preserves highest quality);
  // each image scaled proportionally to that height.
  let maxH = 500;
  for (const id of ranked) maxH = Math.max(maxH, dims[id].h);

  const title = (state.name || '').trim();
  // Offscreen context used only to measure the title text while laying out.
  const measureCtx = document.createElement('canvas').getContext('2d');

  function layoutFor(targetH) {
    const sW = scaledWidths(ranked, dims, targetH);
    const lines = packLines(ranked, sW, Math.max(1800, targetH * 6));
    const totalW = Math.max(...lines.map(l => l.width));
    const T = titleLayout(title, targetH, totalW, measureCtx);
    const totalH = T.titleBandH + lines.length * targetH + (lines.length + 1) * PAD;
    return { targetH, sW, lines, totalW, totalH, ...T };
  }

  const { targetH, sW, lines, totalW, totalH, titleFontPx, titleBandH, titleLines } =
    fitLayout(layoutFor, maxH);
  const { canvas, ctx } = newExportCanvas(totalW, totalH);
  if (title) drawTitle(ctx, titleLines, totalW, PAD, titleFontPx);

  let rank = 1;
  let ly = titleBandH + PAD;
  for (const line of lines) {
    let x = PAD;
    for (const id of line.images) {
      const w = sW[id];
      await drawExportImage(ctx, id, x, ly, w, targetH);
      drawRankNum(ctx, rank, x, ly, targetH);
      x += w + PAD;
      rank++;
    }
    ly += targetH + PAD;
  }

  const topPart = ranked.length < shown.length ? `-top${ranked.length}` : '';
  downloadCanvas(canvas, topPart, ranked.length);
}

// Tier label text: as large as fits inside the colored cell, wrapped by word.
function fitTierLabel(ctx, text, maxW, maxH, startPx, font = titleFont) {
  let px = startPx;
  for (;;) {
    ctx.font = font(px);
    const lines = text ? wrapText(ctx, text, maxW) : [];
    const widest = Math.max(0, ...lines.map(l => ctx.measureText(l).width));
    if (px <= 10 || (widest <= maxW && lines.length * px * 1.2 <= maxH)) return { px, lines };
    px = Math.max(10, Math.floor(px * 0.9));
  }
}

const descFont = (px) => `500 ${px}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;

// Draw a tier's name (and description, if any) centered in its colored cell.
function drawTierLabel(ctx, tier, x, y, w, h, targetH) {
  const pad = Math.round(Math.min(w, h) * 0.08);
  const innerW = w - pad * 2, innerH = h - pad * 2;
  const name = tier.label.trim();
  const desc = (tier.description || '').trim();
  const gapY = desc && name ? Math.round(targetH * 0.04) : 0;
  // The name keeps at least half the height; the description gets the rest.
  const N = fitTierLabel(ctx, name, innerW, desc ? innerH * 0.5 : innerH, Math.round(targetH * 0.3));
  const nameH = N.lines.length * N.px * 1.2;
  const D = fitTierLabel(ctx, desc, innerW, innerH - nameH - gapY,
                         Math.max(10, Math.round(targetH * 0.075)), descFont);
  const descH = D.lines.length * D.px * 1.2;
  ctx.save();
  ctx.fillStyle = textColorFor(tier.color);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let cy = y + (h - (nameH + gapY + descH)) / 2;
  ctx.font = titleFont(N.px);
  for (const l of N.lines) { ctx.fillText(l, x + w / 2, cy + N.px * 0.6); cy += N.px * 1.2; }
  cy += gapY;
  ctx.font = descFont(D.px);
  ctx.globalAlpha = 0.85;
  for (const l of D.lines) { ctx.fillText(l, x + w / 2, cy + D.px * 0.6); cy += D.px * 1.2; }
  ctx.restore();
}

async function exportTierJPG() {
  const tiers = state.tiers || [];
  const shownItems = (t) => visible(t.items).filter(id => state.images[id]);
  const ids = tiers.flatMap(shownItems);
  if (ids.length === 0) {
    showToast(tiers.some(t => t.items.length) ? 'Every tiered image is in a hidden group' : 'Nothing in any tier to export');
    return;
  }
  const PAD = EXPORT_PAD;

  const dims = await measureDims(ids);
  let maxH = 300;
  for (const id of ids) maxH = Math.max(maxH, dims[id].h);

  const title = (state.name || '').trim();
  const measureCtx = document.createElement('canvas').getContext('2d');

  function layoutFor(targetH) {
    const sW = scaledWidths(ids, dims, targetH);
    // Widen the label column when there are descriptions so they stay readable.
    const hasDesc = tiers.some(t => (t.description || '').trim());
    const labelW = hasDesc ? Math.round(targetH * 1.5) : targetH;
    const gap = Math.max(2, Math.round(PAD / 2));  // dark line between tiers
    const rows = tiers.map(t => {
      const items = shownItems(t);
      const lines = items.length
        ? packLines(items, sW, Math.max(1800, targetH * 8))
        : [{ images: [], width: PAD }];
      return { tier: t, lines, h: lines.length * targetH + (lines.length + 1) * PAD };
    });
    const areaW = Math.max(targetH * 4, ...rows.flatMap(r => r.lines.map(l => l.width)));
    const totalW = PAD + labelW + areaW + PAD;
    const T = titleLayout(title, targetH, totalW, measureCtx);
    const totalH = T.titleBandH + PAD + rows.reduce((s, r) => s + r.h, 0)
      + gap * (rows.length - 1) + PAD;
    return { targetH, sW, labelW, gap, rows, areaW, totalW, totalH, ...T };
  }

  const { targetH, sW, labelW, gap, rows, areaW, totalW, totalH, titleFontPx, titleBandH, titleLines } =
    fitLayout(layoutFor, maxH);
  const { canvas, ctx } = newExportCanvas(totalW, totalH);
  if (title) drawTitle(ctx, titleLines, totalW, PAD, titleFontPx);

  let ty = titleBandH + PAD;
  for (const row of rows) {
    // Colored label cell + darker image area.
    ctx.fillStyle = row.tier.color;
    ctx.fillRect(PAD, ty, labelW, row.h);
    ctx.fillStyle = '#2c2c2c';
    ctx.fillRect(PAD + labelW, ty, areaW, row.h);

    drawTierLabel(ctx, row.tier, PAD, ty, labelW, row.h, targetH);

    let ly = ty + PAD;
    for (const line of row.lines) {
      let x = PAD + labelW + PAD;
      for (const id of line.images) {
        await drawExportImage(ctx, id, x, ly, sW[id], targetH);
        x += sW[id] + PAD;
      }
      ly += targetH + PAD;
    }
    ty += row.h + gap;
  }

  downloadCanvas(canvas, '-tiers', ids.length);
}

// ===== Backup / restore =====
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

async function dataUrlToBlob(dataUrl) {
  const res = await fetch(dataUrl);
  return res.blob();
}

async function downloadBackup() {
  showToast('Building backup...');
  // v2 adds mode/tiers/tierPool (and later groups/groupOf); v1 backups
  // (without them) still import as list mode.
  const out = {
    version: 2,
    groups: state.groups,
    groupOf: state.groupOf,
    name: state.name || '',
    mode: state.mode,
    ranked: state.ranked,
    pool: state.pool,
    tiers: state.tiers,
    tierPool: state.tierPool,
    tierAutoColor: state.tierAutoColor,
    images: {},
  };
  for (const id in state.images) {
    const img = state.images[id];
    out.images[id] = {
      name: img.name,
      type: img.blob.type,
      dataUrl: await blobToDataUrl(img.blob),
      annotation: img.annotation || null,
    };
  }
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = url;
  a.download = `${nameSlug('ranking')}-backup-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Backup saved');
}

// Load one or more backup files, each as a new ranking (nothing is replaced).
async function importBackups(files) {
  const jsons = [...files];
  if (jsons.length === 0) return;
  await flushLayout();
  const replaceBlank = activeIsBlank() ? activeId : null;
  const failed = [];
  let lastId = null, count = 0;
  for (const file of jsons) {
    let parsed;
    try {
      parsed = JSON.parse(await file.text());
    } catch (e) {
      failed.push(file.name);
      continue;
    }
    if (!parsed || !Array.isArray(parsed.ranked) || !Array.isArray(parsed.pool) || typeof parsed.images !== 'object') {
      failed.push(file.name);
      continue;
    }
    setSaveStatus(`Importing ${file.name}...`);
    const rid = newRankingId();
    try {
      for (const id in parsed.images) {
        const rec = parsed.images[id];
        const blob = await dataUrlToBlob(rec.dataUrl);
        await dbPut(imgKey(id, rid), { blob, name: rec.name, annotation: rec.annotation || null });
      }
      const name = parsed.name || '';
      const tiers = sanitizeTiers(parsed.tiers);
      await dbPut(layoutKey(rid), {
        name,
        mode: parsed.mode === 'tier' ? 'tier' : 'list',
        ranked: parsed.ranked,
        pool: parsed.pool,
        tiers,
        tierPool: tiers && Array.isArray(parsed.tierPool) ? parsed.tierPool.map(String) : [],
        tierAutoColor: parsed.tierAutoColor === true,
        groups: sanitizeGroups(parsed.groups),
        groupOf: sanitizeGroupOf(parsed.groupOf),
      });
      rankings.push({ id: rid, name });
      lastId = rid;
      count++;
    } catch (e) {
      console.error('Import failed:', file.name, e);
      await dbDelete(prefixRange(rankingPrefix(rid))).catch(() => {});
      failed.push(file.name);
    }
  }
  setSaveStatus('');
  if (lastId) {
    // Drop the empty ranking we were sitting on so imports don't leave clutter.
    if (replaceBlank) {
      rankings = rankings.filter(r => r.id !== replaceBlank);
      await dbDelete(prefixRange(rankingPrefix(replaceBlank))).catch(() => {});
    }
    await loadRanking(lastId);
    showActive();
    await saveMeta();
  }
  if (failed.length) alert(`Could not import:\n${failed.join('\n')}`);
  if (count) showToast(`Imported ${count} ranking${count === 1 ? '' : 's'}`);
}

// ===== UI wiring =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1500);
}

function syncNameInput() {
  document.getElementById('listName').value = state.name || '';
}

document.getElementById('listName').addEventListener('input', (e) => {
  state.name = e.target.value;
  rankings.find(r => r.id === activeId).name = state.name;
  renderTabs();
  saveLayout();  // only the small layout record changes
});

document.getElementById('addImagesBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e) => {
  addFiles(e.target.files);
  e.target.value = '';
});
document.getElementById('captionsBtn').addEventListener('click', async () => {
  const changed = [];
  for (const id in state.images) {
    const im = state.images[id];
    if (im.annotation) continue;
    const text = stripExt(im.name || '').trim();
    if (!text) continue;
    im.annotation = { text, x: 0.5, y: 0.85 };
    cardCache.delete(id);  // rebuild so the new caption bubble appears
    changed.push(id);
  }
  if (changed.length === 0) {
    showToast('No uncaptioned images to populate');
    return;
  }
  render();
  for (const id of changed) await saveImage(id);
  showToast(`Captioned ${changed.length} image${changed.length === 1 ? '' : 's'}`);
});
document.getElementById('clearCaptionsBtn').addEventListener('click', async () => {
  const changed = Object.keys(state.images).filter(id => state.images[id].annotation);
  if (changed.length === 0) {
    showToast('No captions to remove');
    return;
  }
  if (!confirm(`Remove captions from ${changed.length} image${changed.length === 1 ? '' : 's'}?`)) return;
  for (const id of changed) {
    state.images[id].annotation = null;
    cardCache.delete(id);  // rebuild so the caption bubble disappears
  }
  render();
  for (const id of changed) await saveImage(id);
  showToast(`Removed ${changed.length} caption${changed.length === 1 ? '' : 's'}`);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearSelection();
});
document.getElementById('modeListBtn').addEventListener('click', () => setMode('list'));
document.getElementById('modeTierBtn').addEventListener('click', () => setMode('tier'));
document.getElementById('addTierBtn').addEventListener('click', addTier);
document.getElementById('autoColorBtn').addEventListener('click', toggleAutoColor);
document.getElementById('backupBtn').addEventListener('click', downloadBackup);
document.getElementById('restoreBtn').addEventListener('click', () => {
  document.getElementById('restoreInput').click();
});
document.getElementById('restoreInput').addEventListener('change', (e) => {
  importBackups(e.target.files);
  e.target.value = '';
});
document.getElementById('exportBtn').addEventListener('click', exportJPG);
for (const inputId of ['exportLimit', 'exportWidth', 'exportHeight']) {
  document.getElementById(inputId).addEventListener('keydown', (e) => {
    if (e.key === 'Enter') exportJPG();
  });
}
// Sort the unranked pool by filename (natural order, so "img2" < "img10").
// If it's already A→Z, sort Z→A instead.
document.getElementById('sortPoolBtn').addEventListener('click', () => {
  const pool = currentPool();
  if (pool.length < 2) return;
  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const nameOf = id => (state.images[id] && state.images[id].name) || '';
  const asc = [...pool].sort((a, b) => collator.compare(nameOf(a), nameOf(b)));
  const alreadyAsc = asc.every((id, i) => id === pool[i]);
  pool.splice(0, pool.length, ...(alreadyAsc ? asc.reverse() : asc));
  renderPool();
  saveLayout();
  showToast(alreadyAsc ? 'Unranked sorted Z–A' : 'Unranked sorted A–Z');
});

// Reset only the mode on screen: every image goes back to that mode's unranked
// pool (placed ones first, in their current order). Images are shared by both
// modes, so none are deleted and the other mode's arrangement is untouched.
document.getElementById('resetBtn').addEventListener('click', () => {
  const tier = state.mode === 'tier';
  const placed = tier ? state.tiers.flatMap(t => t.items) : state.ranked;
  if (placed.length === 0) {
    showToast(tier ? 'Nothing in any tier to reset' : 'Nothing ranked to reset');
    return;
  }
  const what = tier ? 'tier list' : 'list ranking';
  if (!confirm(`Reset the ${what}? All ${placed.length} placed image${placed.length === 1 ? '' : 's'} go back to Unranked. The other mode is not affected.`)) return;
  if (tier) {
    state.tierPool = [...placed, ...state.tierPool];
    for (const t of state.tiers) t.items = [];
  } else {
    state.pool = [...placed, ...state.pool];
    state.ranked = [];
  }
  render();
  saveLayout();
  showToast(tier ? 'Tier list reset' : 'List ranking reset');
});

// Global drag-drop of files onto the page
let dragDepth = 0;
const overlay = document.getElementById('dropOverlay');
window.addEventListener('dragenter', (e) => {
  if (!e.dataTransfer.types.includes('Files')) return;
  dragDepth++;
  overlay.classList.add('active');
});
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) overlay.classList.remove('active');
});
window.addEventListener('dragover', (e) => {
  if (e.dataTransfer.types.includes('Files')) e.preventDefault();
});
window.addEventListener('drop', (e) => {
  dragDepth = 0;
  overlay.classList.remove('active');
  // A card dropped anywhere that isn't a drop zone (e.g. the title box) must
  // not have its id text pasted in.
  if (dragState) { e.preventDefault(); return; }
  if (!e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
  e.preventDefault();
  const files = [...e.dataTransfer.files];
  const backups = files.filter(f => f.name.toLowerCase().endsWith('.json'));
  if (backups.length) importBackups(backups);
  addFiles(files);
});

// ===== Boot =====
// Drop zones are wired up exactly once (not per render) so listeners don't
// accumulate and slow everything down over time.
setupDropZone(document.getElementById('ranked'), 'ranked');
setupDropZone(document.getElementById('pool'), 'pool');

(async () => {
  try {
    await initStore();
  } catch (e) {
    console.error('Load failed:', e);
    freshState();
    if (!activeId) {
      activeId = newRankingId();
      rankings = [{ id: activeId, name: '' }];
    }
  }
  showActive();
})();
</script>
</body>
