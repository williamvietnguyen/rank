<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ranking</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #232323;
    --panel-2: #2c2c2c;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #4a9eff;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #353535; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #3a8eef; }
  button.danger { color: var(--danger); }
  /* Export button with an attached "top N" field, styled as one split control. */
  .export-group { display: inline-flex; align-items: stretch; }
  .export-group button { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .export-limit {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 0 6px 0 8px; cursor: text;
    background: #3a8eef; border: 1px solid var(--accent); border-left: 1px solid rgba(255,255,255,0.25);
    border-radius: 0;
    color: rgba(255,255,255,0.7); font-size: 11px;
  }
  .export-limit:last-child { border-radius: 0 4px 4px 0; }
  .export-limit input {
    width: 34px; background: transparent; color: #fff;
    border: none; padding: 0; font-size: 13px; font-family: inherit;
    -moz-appearance: textfield;
  }
  .export-limit input::placeholder { color: rgba(255,255,255,0.6); }
  .export-limit input::-webkit-outer-spin-button,
  .export-limit input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .export-limit input:focus { outline: none; }
  .export-limit:focus-within { background: #2f7fd9; }

  .tabs {
    display: flex; align-items: flex-end; gap: 2px;
    padding: 6px 16px 0; background: var(--panel);
    border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .tabs .tab {
    display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
    max-width: 220px; margin-bottom: -1px;
    background: transparent; color: var(--muted);
    border: 1px solid transparent; border-bottom: none;
    border-radius: 4px 4px 0 0; padding: 6px 8px 7px 12px;
  }
  .tabs .tab:hover { background: var(--panel-2); color: var(--text); }
  .tabs .tab.active {
    background: var(--bg); color: var(--text);
    border-color: var(--border); border-bottom: 1px solid var(--bg);
  }
  .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-close, .tab-dup {
    width: 16px; height: 16px; line-height: 15px; text-align: center;
    border-radius: 50%; font-size: 13px; color: var(--muted); visibility: hidden;
  }
  .tab:hover .tab-close, .tab.active .tab-close,
  .tab:hover .tab-dup, .tab.active .tab-dup { visibility: visible; }
  .tab-dup { font-size: 11px; }
  .tab-dup:hover { background: var(--accent); color: #fff; }
  .tab-close:hover { background: var(--danger); color: #fff; }
  .tabs .tab.drop-target {
    background: rgba(74, 158, 255, 0.2); color: var(--text);
    border-color: var(--accent); border-bottom: none;
  }
  .tabs .tab-new {
    flex-shrink: 0; margin: 0 0 4px 6px; padding: 3px 10px;
    background: transparent; border-color: transparent; color: var(--muted); font-size: 12px;
  }
  .tabs .tab-new:hover { color: var(--text); background: var(--panel-2); }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  .list-title {
    width: 100%; display: block;
    background: transparent; color: var(--text);
    border: none; border-bottom: 1px solid transparent;
    padding: 2px 0 8px; margin: 0;
    font-family: inherit; font-size: 30px; font-weight: 700; letter-spacing: -0.01em;
  }
  .list-title::placeholder { color: var(--muted); font-weight: 600; }
  .list-title:hover { border-bottom-color: var(--border); }
  .list-title:focus { outline: none; border-bottom-color: var(--accent); }

  .rank-area {
    border: 1px solid var(--border); background: var(--panel); padding: 8px;
  }
  .rank-area h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .rank-area-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .rank-area-head h2 { margin: 0; }
  button.small { font-size: 12px; padding: 2px 8px; }
  .rank-images {
    display: flex; flex-wrap: wrap; align-content: flex-start;
    gap: 4px; min-height: 160px; padding: 4px; background: var(--panel-2);
  }
  .rank-images.drag-over { background: #3a3a3a; }
  .rank-empty { color: var(--muted); font-size: 13px; padding: 48px; text-align: center; width: 100%; }

  .img-card {
    cursor: grab; position: relative; border: 1px solid transparent;
    line-height: 0;
  }
  .img-card img { display: block; height: 150px; width: auto; }
  .img-card:hover { border-color: var(--accent); }
  .img-card:active { cursor: grabbing; }
  .img-card.dragging { opacity: 0.3; }
  .img-card { user-select: none; -webkit-user-select: none; }
  .img-card.selected::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    border: 3px solid var(--accent); background: rgba(74, 158, 255, 0.22);
  }
  /* Rubber-band box drawn while drag-selecting over empty space. */
  .marquee {
    position: absolute; z-index: 50; pointer-events: none;
    border: 1px solid var(--accent); background: rgba(74, 158, 255, 0.15);
  }
  body.marquee-active { user-select: none; -webkit-user-select: none; }
  /* "N" badge shown on the drag image when dragging a multi-selection. */
  .drag-count {
    position: absolute; top: 4px; right: 4px; z-index: 1;
    min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    line-height: 24px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .rank-num {
    position: absolute; top: 0; left: 0;
    min-width: 15px; height: 15px; padding: 0 3px;
    background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 15px;
    text-align: center; pointer-events: none;
    border-bottom-right-radius: 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  .drop-placeholder {
    background: rgba(74, 158, 255, 0.2);
    border: 2px dashed var(--accent);
    border-radius: 2px;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  .img-card .remove, .img-card .text-btn {
    position: absolute;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: #fff; border: none;
    font-size: 11px; line-height: 18px; padding: 0;
    cursor: pointer; display: none; font-weight: bold;
  }
  .img-card .remove { top: 2px; right: 2px; }
  .img-card .text-btn { bottom: 2px; left: 2px; top: auto; }
  .img-card:hover .remove, .img-card:hover .text-btn { display: block; }

  /* Tier upper bound (UI only, never exported): per tier, one image can be
     marked as the ceiling that everything else in the tier falls below. */
  .img-card .bound-btn {
    position: absolute; bottom: 2px; right: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: #fff; border: none;
    font-size: 9px; line-height: 18px; padding: 0; cursor: pointer; display: none;
  }
  .img-card .bound-btn:hover { background: var(--accent); }
  .tier-items .img-card:hover .bound-btn { display: block; }
  .img-card.bound-upper { --bound: #3ecf8e; }
  .img-card.bound-upper .bound-btn { display: block; background: var(--bound); }
  .img-card.bound-upper::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
    border: 3px solid var(--bound);
  }
  .bound-tag {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2;
    padding: 0 6px; height: 15px; line-height: 15px; border-radius: 0 0 4px 4px;
    background: var(--bound); color: #111; font-size: 9px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; pointer-events: none; white-space: nowrap;
  }

  .img-bubble {
    position: absolute;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    cursor: move;
    user-select: none;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    max-width: calc(100% - 8px);
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .file-drop-overlay {
    position: fixed; inset: 0; background: rgba(74,158,255,0.15);
    border: 4px dashed var(--accent); pointer-events: none;
    display: none; align-items: center; justify-content: center;
    font-size: 24px; color: var(--accent); z-index: 1000;
  }
  .file-drop-overlay.active { display: flex; }

  /* Title row with the List / Tier mode switch. */
  .title-row { display: flex; align-items: center; gap: 12px; }
  .title-row .list-title { flex: 1; min-width: 0; }
  .mode-toggle {
    display: inline-flex; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
  }
  .mode-toggle button { border: none; border-radius: 0; color: var(--muted); }
  .mode-toggle button + button { border-left: 1px solid var(--border); }
  .mode-toggle button.active { background: var(--accent); color: #fff; }

  body.tier-mode #listArea, body:not(.tier-mode) #tierArea { display: none; }
  body.tier-mode .top-limit { display: none; }

  .tier-board { display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
  .tier-row { display: flex; align-items: stretch; background: var(--panel-2); }
  .tier-label {
    width: 120px; flex-shrink: 0; padding: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; text-align: center; word-break: break-word;
  }
  .tier-name, .tier-desc { max-width: 100%; cursor: text; outline: none; border-radius: 3px; }
  .tier-name { min-width: 1ch; font-size: 22px; font-weight: 700; }
  .tier-desc { font-size: 11px; font-weight: 500; line-height: 1.3; opacity: 0.85; }
  .tier-name:focus, .tier-desc:focus { box-shadow: 0 0 0 2px var(--accent); }
  /* An empty description shows a placeholder only while hovering or editing it. */
  .tier-desc:empty::before { content: '+ description'; font-style: italic; opacity: 0.6; }
  .tier-row:not(:hover) .tier-desc:empty:not(:focus) { display: none; }
  .tier-row .tier-items { flex: 1; min-height: 160px; background: transparent; }
  .tier-row .tier-items.drag-over { background: #3a3a3a; }
  .tier-controls {
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    padding: 4px; background: var(--panel);
  }
  .tier-controls button { width: 24px; height: 22px; padding: 0; font-size: 11px; }
  .tier-controls input[type=color] {
    width: 24px; height: 22px; padding: 0; border: 1px solid var(--border);
    border-radius: 4px; background: none; cursor: pointer;
  }
  .tier-actions { display: flex; gap: 6px; margin-top: 8px; }
  button.auto-color.active {
    color: #1a1a1a; border-color: transparent;
    background: linear-gradient(90deg, #ff7f7f, #ffbf7f, #ffff7f, #7fff7f, #7fbfff, #bf7fff);
  }

  /* Groups: images can belong to one group; a hidden group's images are left
     out of the board and the export. */
  .group-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .group-bar-label {
    font-size: 13px; color: var(--muted); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px;
  }
  .group-hint { color: var(--muted); font-size: 12px; }
  .group-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 3px 2px 6px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
  }
  .group-chip.drop-target { border-color: var(--accent); background: rgba(74, 158, 255, 0.2); }
  .group-chip.is-hidden { opacity: 0.55; }
  .group-chip.is-hidden .group-name { text-decoration: line-through; }
  .group-chip input[type=color] {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; padding: 0; border: none; background: none; cursor: pointer;
  }
  .group-chip input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .group-chip input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }
  .group-chip input[type=color]::-moz-color-swatch { border: none; border-radius: 50%; }
  .group-name { outline: none; min-width: 2ch; padding: 0 2px; border-radius: 3px; cursor: text; }
  .group-name:focus { box-shadow: 0 0 0 2px var(--accent); }
  .group-count { color: var(--muted); font-size: 11px; }
  .group-chip button { font-size: 11px; padding: 1px 6px; }
  .img-card .group-stripe {
    position: absolute; left: 0; right: 0; bottom: 0; height: 5px; pointer-events: none;
  }
  /* Group colors are off by default; membership then shows only on hover. */
  body:not(.group-colors) .group-stripe,
  body:not(.group-colors) .group-chip input[type=color] { display: none !important; }

  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 4px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Ranking</h1>
  <button id="addImagesBtn">+ Add Images</button>
  <button id="captionsBtn" title="Populate captions on uncaptioned images using their filenames">Captions from filenames</button>
  <button id="clearCaptionsBtn" title="Remove captions from all images">Clear captions</button>
  <span style="flex:1"></span>
  <span id="imageCount" style="color: var(--muted); font-size: 12px; margin-right: 12px;"></span>
  <span id="saveStatus" style="color: var(--muted); font-size: 12px; margin-right: 8px;"></span>
  <button id="backupBtn" title="Download this ranking + its images as a single .json file">Backup</button>
  <button id="restoreBtn" title="Load one or more .json backups, each as a new ranking tab (you can also drop .json files on the page)">Import</button>
  <span class="export-group">
    <button id="exportBtn" class="primary">Export JPG</button>
    <label class="export-limit top-limit" title="Only export the top N ranked images — leave blank to export all">
      top <input id="exportLimit" type="number" min="1" step="1" placeholder="all" />
    </label>
    <label class="export-limit" title="Max width of the exported image in pixels (aspect ratio is kept) — leave blank for the normal size">
      w <input id="exportWidth" type="number" min="1" step="1" placeholder="auto" style="width: 44px" />
    </label>
    <label class="export-limit" title="Max height of the exported image in pixels (aspect ratio is kept) — leave blank for the normal size">
      h <input id="exportHeight" type="number" min="1" step="1" placeholder="auto" style="width: 44px" />
    </label>
  </span>
  <button id="resetBtn" class="danger" title="Move every image in the current mode back to Unranked (the other mode and the images themselves are kept)">Reset</button>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />
  <input type="file" id="restoreInput" accept="application/json,.json" multiple style="display:none" />
</header>
<nav class="tabs" id="tabs"></nav>

<main>
  <div class="title-row">
    <input id="listName" class="list-title" type="text" placeholder="Untitled ranking"
           title="Title for this ranking — shown at the top of the export and used in export & backup filenames" />
    <span class="mode-toggle" title="Rank as an ordered list or as a tier list (each mode keeps its own arrangement)">
      <button id="modeListBtn" data-mode="list">List</button>
      <button id="modeTierBtn" data-mode="tier">Tier</button>
    </span>
  </div>
  <div class="group-bar" id="groupBar"></div>
  <div class="rank-area" id="listArea">
    <h2>Ranking (best &rarr; worst, left to right)</h2>
    <div class="rank-images" id="ranked" data-tier="ranked"></div>
  </div>
  <div class="rank-area" id="tierArea">
    <h2>Tiers</h2>
    <div class="tier-board" id="tierBoard"></div>
    <div class="tier-actions">
      <button id="addTierBtn" class="small">+ Add tier</button>
      <button id="autoColorBtn" class="small auto-color"
              title="Color the tiers as an evenly spaced rainbow, top to bottom, and keep it that way as tiers are added, removed or reordered (picking a color by hand turns this off)">Auto colors: off</button>
    </div>
  </div>
  <div class="rank-area">
    <div class="rank-area-head">
      <h2>Unranked</h2>
      <button id="sortPoolBtn" class="small" title="Sort unranked images alphabetically by filename (click again to reverse)">Sort A&ndash;Z</button>
    </div>
    <div class="rank-images" id="pool" data-tier="pool"></div>
  </div>
</main>

<div class="file-drop-overlay" id="dropOverlay">Drop images to add</div>
<div class="toast" id="toast"></div>

<script>
// ===== IndexedDB helpers =====
const DB_NAME = 'ranking';
const DB_VERSION = 1;
const STORE = 'state';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
// Every ranking's records live under its own 'r:<rankingId>:' prefix:
// 'r:<rid>:layout' holds the (tiny) ordering + name, and 'r:<rid>:img:<id>'
// holds one image's blob. A reorder writes only the small layout record
// instead of rewriting every image blob, and switching/deleting a ranking
// touches only its own key range. 'meta' holds the tab order and which
// ranking is open. onabort is handled so a failed/aborted transaction rejects
// instead of hanging forever.
const META_KEY = 'meta';
// Pre-multi-ranking keys, migrated into a ranking on first load.
const OLD_LAYOUT_KEY = 'layout';
const OLD_IMG_PREFIX = 'img:';
const LEGACY_KEY = 'current';

const rankingPrefix = (rid) => `r:${rid}:`;
const prefixRange = (prefix) => IDBKeyRange.bound(prefix, prefix + '￿');

async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('save error'));
    tx.onabort = () => reject(tx.error || new Error('save aborted (storage quota?)'));
  });
}
// Accepts a single key or an IDBKeyRange.
async function dbDelete(keyOrRange) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(keyOrRange);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('delete error'));
    tx.onabort = () => reject(tx.error || new Error('delete aborted'));
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    tx.oncomplete = () => resolve(req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
// Returns just the keys within `range` (no values, so no image blobs are read).
async function dbGetKeys(range) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAllKeys(range);
    tx.oncomplete = () => resolve(req.result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}
// Returns {key: value} for every record, or only those within `range`.
async function dbGetAll(range) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const store = tx.objectStore(STORE);
    const keysReq = store.getAllKeys(range);
    const valsReq = store.getAll(range);
    tx.oncomplete = () => {
      const out = {};
      keysReq.result.forEach((k, i) => { out[k] = valsReq.result[i]; });
      resolve(out);
    };
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

// ===== State =====
let rankings = [];     // [{id, name}] in tab order
let activeId = null;   // id of the ranking currently open
// List and tier mode each keep their own arrangement of the same images, so
// flipping between modes never loses either one. `tiers` stays null until the
// ranking is first opened in tier mode.
let state = {
  name: '',     // user-given title for this list
  mode: 'list', // 'list' | 'tier'
  ranked: [],   // list mode: [imageId] in rank order, left to right
  pool: [],     // list mode: unranked [imageId]
  tiers: null,  // tier mode: [{id, label, color, items: [imageId]}] top to bottom
  tierPool: [], // tier mode: unranked [imageId]
  groups: [],   // [{id, name, color, hidden}] — shared by both modes
  groupOf: {},  // {imageId: groupId}; an image is in at most one group
  images: {},   // {id: {blob, name, url, annotation}}
};
let nextId = 1;
const newId = () => 'id_' + (nextId++);
const newRankingId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Storage keys for the open ranking.
const layoutKey = (rid = activeId) => rankingPrefix(rid) + 'layout';
const imgKey = (id, rid = activeId) => rankingPrefix(rid) + 'img:' + id;

function freshState() {
  state = { name: '', mode: 'list', ranked: [], pool: [], tiers: null, tierPool: [], tierAutoColor: false, groups: [], groupOf: {}, images: {} };
}

function layoutRecord() {
  return {
    name: state.name, mode: state.mode,
    ranked: state.ranked, pool: state.pool,
    tiers: state.tiers, tierPool: state.tierPool, tierAutoColor: state.tierAutoColor,
    groups: state.groups, groupOf: state.groupOf,
  };
}

// ===== Tiers =====
const TIER_COLORS = ['#ff7f7f', '#ffbf7f', '#ffdf7f', '#ffff7f', '#bfff7f', '#7fff7f',
                     '#7fffff', '#7fbfff', '#7f7fff', '#ff7fff', '#bf7fbf'];
const TIER_LABELS = ['S', ...'ABCDEFGHIJKLMNOPQRTUVWXYZ'];  // S, then A–Z (S already used)
const newTierId = () => 't' + Math.random().toString(36).slice(2, 9);

function defaultTiers() {
  return TIER_LABELS.slice(0, 5).map((label, i) =>
    ({ id: newTierId(), label, description: '', color: TIER_COLORS[i], items: [] }));
}

// Coerce stored/imported tier data into a valid shape (null if absent).
function sanitizeTiers(tiers) {
  if (!Array.isArray(tiers)) return null;
  const ids = new Set();
  return tiers.filter(t => t && typeof t === 'object').map((t, i) => {
    let id = typeof t.id === 'string' && t.id ? t.id : newTierId();
    while (ids.has(id)) id = newTierId();
    ids.add(id);
    return {
      id,
      label: typeof t.label === 'string' ? t.label : '',
      description: typeof t.description === 'string' ? t.description : '',
      color: /^#[0-9a-f]{6}$/i.test(t.color) ? t.color : TIER_COLORS[i % TIER_COLORS.length],
      items: Array.isArray(t.items) ? t.items.map(String) : [],
      upper: typeof t.upper === 'string' ? t.upper : null,
    };
  });
}

// First time a ranking enters tier mode: default tiers, everything unranked.
function ensureTiers() {
  if (state.tiers) return;
  state.tiers = defaultTiers();
  state.tierPool = [...state.ranked, ...state.pool];
  state.tierAutoColor = true;
  applyTierGradient();
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(c * 255).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

// Pastel rainbow by position, top to bottom: hues 30° apart (red, orange,
// yellow, lime, green, ... — the classic tier-list look), spreading out evenly
// once there are too many tiers to fit before wrapping back toward red.
function applyTierGradient() {
  const n = state.tiers.length;
  const step = n > 1 ? Math.min(30, 280 / (n - 1)) : 0;
  state.tiers.forEach((t, i) => { t.color = hslToHex(i * step, 100, 75); });
}

// After the tier list's structure changes, recolor if auto colors is on.
function tiersChanged() {
  if (state.tierAutoColor) applyTierGradient();
  render();
  saveLayout();
}

function toggleAutoColor() {
  state.tierAutoColor = !state.tierAutoColor;
  if (state.tierAutoColor) applyTierGradient();
  render();
  saveLayout();
  showToast(state.tierAutoColor ? 'Auto colors on' : 'Auto colors off — colors kept as they are');
}

// Make each mode's arrangement hold every image exactly once: drop unknown or
// duplicate ids and put any image that's missing into that mode's pool.
function normalizeLayout() {
  const seen = new Set();
  const clean = (list) => list.filter(id => state.images[id] && !seen.has(id) && seen.add(id));
  const addMissing = (pool) => { for (const id in state.images) if (!seen.has(id)) pool.push(id); };
  state.ranked = clean(state.ranked);
  state.pool = clean(state.pool);
  addMissing(state.pool);
  if (state.tiers) {
    seen.clear();
    for (const t of state.tiers) t.items = clean(t.items);
    state.tierPool = clean(state.tierPool);
    addMissing(state.tierPool);
  }
  // Keep only memberships of existing images in existing groups.
  const gids = new Set(state.groups.map(g => g.id));
  const groupOf = {};
  for (const id in state.groupOf) {
    if (state.images[id] && gids.has(state.groupOf[id])) groupOf[id] = state.groupOf[id];
  }
  state.groupOf = groupOf;
}

function textColorFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  return lum > 0.55 ? '#1a1a1a' : '#fff';
}

// ===== Tier upper bound =====
// The bound only means something while its image sits in that tier, so drop
// it once the image has been moved out (or removed).
function pruneBounds() {
  for (const t of state.tiers || []) {
    if (t.upper && !t.items.includes(t.upper)) t.upper = null;
  }
}

// Toggle imgId as its tier's upper bound. Marking it moves the image to the
// front of the tier, since everything else in the tier falls below it.
function toggleBound(imgId) {
  const tier = (state.tiers || []).find(t => t.items.includes(imgId));
  if (!tier) return;
  if (tier.upper === imgId) {
    tier.upper = null;
  } else {
    tier.upper = imgId;
    tier.items.splice(tier.items.indexOf(imgId), 1);
    tier.items.unshift(imgId);
  }
  render();
  saveLayout();
}

// Show/hide a card's upper-bound styling.
function setCardBound(card, isUpper) {
  card.classList.toggle('bound-upper', isUpper);
  card._boundTag.style.display = isUpper ? '' : 'none';
}

// ===== Groups =====
const GROUP_COLORS = ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231',
                      '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#9a6324'];
const newGroupId = () => 'g' + Math.random().toString(36).slice(2, 9);

// Coerce stored/imported group data into a valid shape.
function sanitizeGroups(groups) {
  if (!Array.isArray(groups)) return [];
  const ids = new Set();
  return groups.filter(g => g && typeof g === 'object').map((g, i) => {
    let id = typeof g.id === 'string' && g.id ? g.id : newGroupId();
    while (ids.has(id)) id = newGroupId();
    ids.add(id);
    return {
      id,
      name: typeof g.name === 'string' ? g.name : '',
      color: /^#[0-9a-f]{6}$/i.test(g.color) ? g.color : GROUP_COLORS[i % GROUP_COLORS.length],
      hidden: g.hidden === true,
    };
  });
}

function sanitizeGroupOf(map) {
  return map && typeof map === 'object' && !Array.isArray(map) ? { ...map } : {};
}

function groupOfImage(imgId) {
  const gid = state.groupOf[imgId];
  return gid ? state.groups.find(g => g.id === gid) || null : null;
}

function isHidden(imgId) {
  const g = groupOfImage(imgId);
  return !!(g && g.hidden);
}

// The ids of a list that are actually shown (not in a hidden group).
function visible(list) {
  return list.filter(id => !isHidden(id));
}

function groupMembers(gid) {
  return Object.keys(state.groupOf).filter(id => state.groupOf[id] === gid);
}

// Group stripe + tooltip on a card.
function setCardGroup(card, imgId) {
  const g = groupOfImage(imgId);
  card._groupStripe.style.display = g ? '' : 'none';
  if (g) card._groupStripe.style.background = g.color;
  const name = (state.images[imgId] && state.images[imgId].name) || '';
  card.title = g ? `${name}\nGroup: ${g.name.trim() || 'Untitled group'}` : name;
}

function syncCardGroups() {
  for (const [id, card] of cardCache) setCardGroup(card, id);
}

// gid null removes the images from their group.
function assignGroup(ids, gid) {
  const g = gid && state.groups.find(x => x.id === gid);
  for (const id of ids) {
    if (g) state.groupOf[id] = gid; else delete state.groupOf[id];
    if (g && g.hidden) selected.delete(id);  // can't keep hidden cards selected
  }
  render();
  saveLayout();
  const n = `${ids.length} image${ids.length === 1 ? '' : 's'}`;
  showToast(g ? `Added ${n} to ${g.name.trim() || 'group'}` : `Removed ${n} from their group`);
}

function newGroup() {
  const used = new Set(state.groups.map(g => g.color));
  const names = new Set(state.groups.map(g => g.name.trim()));
  let n = 1;
  while (names.has(`Group ${n}`)) n++;
  const g = {
    id: newGroupId(),
    name: `Group ${n}`,
    color: GROUP_COLORS.find(c => !used.has(c)) || GROUP_COLORS[state.groups.length % GROUP_COLORS.length],
    hidden: false,
  };
  state.groups.push(g);
  const ids = selectionInOrder();
  for (const id of ids) state.groupOf[id] = g.id;
  render();
  saveLayout();
  // Start renaming right away.
  const nameEl = document.querySelector(`#groupBar [data-group-id="${g.id}"] .group-name`);
  if (nameEl) {
    nameEl.focus();
    getSelection().selectAllChildren(nameEl);
  }
}

function toggleGroupHidden(gid) {
  const g = state.groups.find(x => x.id === gid);
  if (!g) return;
  g.hidden = !g.hidden;
  if (g.hidden) for (const id of groupMembers(gid)) selected.delete(id);
  render();
  saveLayout();
}

// Deleting a group only ungroups its images; nothing else changes.
function deleteGroup(gid) {
  state.groups = state.groups.filter(g => g.id !== gid);
  for (const id of groupMembers(gid)) delete state.groupOf[id];
  render();
  saveLayout();
}

// Whether group colors are drawn (card stripes + chip swatches). A per-browser
// preference, off by default.
let groupColors = false;
try { groupColors = localStorage.getItem('groupColors') === 'on'; } catch (e) {}
document.body.classList.toggle('group-colors', groupColors);

function toggleGroupColors() {
  groupColors = !groupColors;
  try { localStorage.setItem('groupColors', groupColors ? 'on' : 'off'); } catch (e) {}
  document.body.classList.toggle('group-colors', groupColors);
  renderGroupBar();
}

function renderGroupBar() {
  const bar = document.getElementById('groupBar');
  bar.replaceChildren();
  const label = document.createElement('span');
  label.className = 'group-bar-label';
  label.textContent = 'Groups';
  bar.appendChild(label);
  const sel = selectionInOrder();

  for (const g of state.groups) {
    const members = groupMembers(g.id);
    const chip = document.createElement('div');
    chip.className = 'group-chip' + (g.hidden ? ' is-hidden' : '');
    chip.dataset.groupId = g.id;

    const color = document.createElement('input');
    color.type = 'color';
    color.value = g.color;
    color.title = 'Group color';
    color.addEventListener('input', () => {
      g.color = color.value;
      syncCardGroups();
      saveLayout();
    });
    chip.appendChild(color);

    const name = document.createElement('span');
    name.className = 'group-name';
    try { name.contentEditable = 'plaintext-only'; } catch (e) { name.contentEditable = 'true'; }
    name.spellcheck = false;
    name.textContent = g.name;
    name.title = 'Click to rename this group';
    name.addEventListener('input', () => {
      g.name = name.textContent;
      saveLayout();
    });
    name.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); name.blur(); }
    });
    name.addEventListener('blur', () => {
      if (!name.textContent.trim()) name.textContent = '';
      syncCardGroups();
    });
    chip.appendChild(name);

    const count = document.createElement('span');
    count.className = 'group-count';
    count.textContent = members.length;
    chip.appendChild(count);

    const btn = (text, title, onClick) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.title = title;
      b.addEventListener('click', onClick);
      chip.appendChild(b);
    };
    const toAdd = sel.filter(id => state.groupOf[id] !== g.id);
    if (toAdd.length) {
      btn(`+${toAdd.length}`, `Add the ${toAdd.length} selected image${toAdd.length === 1 ? '' : 's'} to this group`,
        () => assignGroup(toAdd, g.id));
    }
    btn(g.hidden ? 'Show' : 'Hide',
      g.hidden ? 'Show this group\'s images again' : 'Hide this group\'s images (also leaves them out of the export)',
      () => toggleGroupHidden(g.id));
    btn('×', 'Delete group (its images stay, just ungrouped)', () => deleteGroup(g.id));

    // Dropping cards on a chip adds them to that group.
    chip.addEventListener('dragover', (e) => {
      if (!dragState) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      chip.classList.add('drop-target');
    });
    chip.addEventListener('dragleave', (e) => {
      if (!chip.contains(e.relatedTarget)) chip.classList.remove('drop-target');
    });
    chip.addEventListener('drop', (e) => {
      chip.classList.remove('drop-target');
      if (!dragState) return;
      e.preventDefault();
      assignGroup(dragState.ids, g.id);
    });
    bar.appendChild(chip);
  }

  const add = document.createElement('button');
  add.className = 'small';
  add.textContent = sel.length ? `+ New group from ${sel.length} selected` : '+ New group';
  add.title = 'Create a group (from the selected images, if any). Add more later by selecting images and clicking a group\'s +N, or by dragging images onto it.';
  add.addEventListener('click', newGroup);
  bar.appendChild(add);

  const grouped = sel.filter(id => state.groupOf[id]);
  if (grouped.length) {
    const un = document.createElement('button');
    un.className = 'small';
    un.textContent = 'Ungroup selected';
    un.title = 'Remove the selected images from their groups';
    un.addEventListener('click', () => assignGroup(grouped, null));
    bar.appendChild(un);
  }
  if (state.groups.length) {
    const colors = document.createElement('button');
    colors.className = 'small';
    colors.textContent = groupColors ? 'Colors: on' : 'Colors: off';
    colors.title = 'Show or hide group colors on the images (hover an image to see its group either way)';
    colors.addEventListener('click', toggleGroupColors);
    bar.appendChild(colors);
  }
  if (!state.groups.length && !sel.length) {
    const hint = document.createElement('span');
    hint.className = 'group-hint';
    hint.textContent = 'Select images, then create a group to show/hide them together.';
    bar.appendChild(hint);
  }
}

function nextTierLabel() {
  const used = new Set(state.tiers.map(t => t.label.trim()));
  return TIER_LABELS.find(l => !used.has(l)) || '?';
}

function setMode(mode) {
  if (state.mode === mode) return;
  state.mode = mode;
  clearSelection();
  if (mode === 'tier') ensureTiers();
  render();
  saveLayout();
}

// Turn a list name into a filename-safe slug. Falls back to 'ranking' so the
// download always has a sensible base even when no name was entered.
function nameSlug(fallback) {
  const slug = (state.name || '').trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
  return slug || fallback;
}

function computeNextId() {
  let maxId = 0;
  const scan = (s) => { const m = /^id_(\d+)$/.exec(s); if (m) maxId = Math.max(maxId, +m[1]); };
  Object.keys(state.images).forEach(scan);
  nextId = maxId + 1;
}

function adoptImageRecord(id, rec) {
  state.images[id] = {
    blob: rec.blob,
    name: rec.name,
    annotation: rec.annotation || null,
    url: URL.createObjectURL(rec.blob),
  };
}

function releaseImages() {
  for (const id in state.images) {
    if (state.images[id].url) URL.revokeObjectURL(state.images[id].url);
  }
  cardCache.clear();
}

async function saveMeta() {
  await dbPut(META_KEY, { order: rankings.map(r => r.id), active: activeId });
}

// Load the tab list, migrating pre-multi-ranking data into a first ranking.
async function initStore() {
  const meta = await dbGet(META_KEY);
  if (meta && Array.isArray(meta.order)) {
    rankings = [];
    for (const rid of meta.order) {
      const layout = await dbGet(layoutKey(rid));
      rankings.push({ id: rid, name: (layout && layout.name) || '' });
    }
    activeId = rankings.some(r => r.id === meta.active) ? meta.active : null;
  } else {
    await migrateOldData();
  }
  if (rankings.length === 0) {
    const rid = newRankingId();
    await dbPut(layoutKey(rid), { name: '', ranked: [], pool: [] });
    rankings = [{ id: rid, name: '' }];
  }
  if (!activeId) activeId = rankings[0].id;
  await saveMeta();
  await loadRanking(activeId);
}

async function migrateOldData() {
  rankings = [];
  activeId = null;
  const all = await dbGetAll();
  const imgKeys = Object.keys(all).filter(k => k.startsWith(OLD_IMG_PREFIX));
  let layout, images = {};
  if (all[OLD_LAYOUT_KEY] || imgKeys.length) {
    layout = all[OLD_LAYOUT_KEY] || {};
    for (const k of imgKeys) images[k.slice(OLD_IMG_PREFIX.length)] = all[k];
  } else if (all[LEGACY_KEY]) {
    layout = all[LEGACY_KEY];
    images = layout.images || {};
  } else {
    return;  // nothing to migrate
  }
  const rid = newRankingId();
  for (const id in images) {
    const rec = images[id];
    await dbPut(imgKey(id, rid), { blob: rec.blob, name: rec.name, annotation: rec.annotation || null });
  }
  const name = layout.name || '';
  await dbPut(layoutKey(rid), { name, ranked: layout.ranked || [], pool: layout.pool || [] });
  rankings = [{ id: rid, name }];
  activeId = rid;
  // Only drop the old records once the new ones are safely written.
  await dbDelete(OLD_LAYOUT_KEY);
  await dbDelete(LEGACY_KEY);
  for (const k of imgKeys) await dbDelete(k);
}

async function loadRanking(rid) {
  const prefix = rankingPrefix(rid);
  const recs = await dbGetAll(prefixRange(prefix));
  releaseImages();
  selected.clear();
  selectAnchor = null;
  const layout = recs[layoutKey(rid)] || {};
  state = {
    name: layout.name || '',
    mode: layout.mode === 'tier' ? 'tier' : 'list',
    ranked: layout.ranked || [],
    pool: layout.pool || [],
    tiers: sanitizeTiers(layout.tiers),
    tierPool: layout.tierPool || [],
    tierAutoColor: layout.tierAutoColor === true,
    groups: sanitizeGroups(layout.groups),
    groupOf: sanitizeGroupOf(layout.groupOf),
    images: {},
  };
  const imgPrefix = prefix + 'img:';
  for (const k in recs) {
    if (k.startsWith(imgPrefix)) adoptImageRecord(k.slice(imgPrefix.length), recs[k]);
  }
  if (state.mode === 'tier') ensureTiers();
  normalizeLayout();
  computeNextId();
  activeId = rid;
}

function imageRecord(id) {
  const im = state.images[id];
  return { blob: im.blob, name: im.name, annotation: im.annotation || null };
}

// Layout (ordering) save: debounced and tiny, so frequent reorders are cheap.
let layoutSaveTimer = null;
function saveLayout() {
  if (layoutSaveTimer) clearTimeout(layoutSaveTimer);
  setSaveStatus('Saving...');
  layoutSaveTimer = setTimeout(writeLayout, 250);
}

async function writeLayout() {
  layoutSaveTimer = null;
  try {
    await dbPut(layoutKey(), layoutRecord());
    setSaveStatus('Saved');
    setTimeout(() => setSaveStatus(''), 1200);
  } catch (e) {
    setSaveStatus('Save failed: ' + e.message);
  }
}

// Write any pending layout save now — called before switching rankings so the
// debounced save doesn't land under the wrong ranking.
async function flushLayout() {
  if (!layoutSaveTimer) return;
  clearTimeout(layoutSaveTimer);
  await writeLayout();
}

// Image saves are immediate but targeted — only the one changed image is written.
async function saveImage(id) {
  if (!state.images[id]) return;
  setSaveStatus('Saving...');
  try {
    await dbPut(imgKey(id), imageRecord(id));
    setSaveStatus('Saved');
    setTimeout(() => setSaveStatus(''), 1200);
  } catch (e) {
    setSaveStatus('Save failed: ' + e.message);
  }
}

async function deleteImageRecord(id) {
  try {
    await dbDelete(imgKey(id));
  } catch (e) {
    setSaveStatus('Save failed: ' + e.message);
  }
}

function setSaveStatus(s) {
  document.getElementById('saveStatus').textContent = s;
}

// ===== Rankings (tabs) =====
function renderTabs() {
  const bar = document.getElementById('tabs');
  bar.replaceChildren();
  for (const r of rankings) {
    const tab = document.createElement('button');
    tab.className = 'tab' + (r.id === activeId ? ' active' : '');
    tab.title = r.name || 'Untitled ranking';
    const label = document.createElement('span');
    label.className = 'tab-label';
    label.textContent = r.name.trim() || 'Untitled';
    tab.appendChild(label);
    const dup = document.createElement('span');
    dup.className = 'tab-dup';
    dup.textContent = '⧉';
    dup.title = 'Duplicate this ranking';
    dup.addEventListener('click', (e) => {
      e.stopPropagation();
      duplicateRanking(r.id);
    });
    tab.appendChild(dup);
    const close = document.createElement('span');
    close.className = 'tab-close';
    close.textContent = '×';
    close.title = 'Delete this ranking';
    close.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteRanking(r.id);
    });
    tab.appendChild(close);
    tab.addEventListener('click', () => switchRanking(r.id));
    if (r.id !== activeId) setupTabDrop(tab, r.id);
    bar.appendChild(tab);
  }
  const add = document.createElement('button');
  add.className = 'tab-new';
  add.textContent = '+ New ranking';
  add.addEventListener('click', newRanking);
  bar.appendChild(add);
}

// Dropping an image card on another ranking's tab copies it into that
// ranking's unranked pool; the image stays where it is in this ranking.
function setupTabDrop(tab, rid) {
  tab.addEventListener('dragover', (e) => {
    if (!dragState) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    tab.classList.add('drop-target');
  });
  tab.addEventListener('dragleave', (e) => {
    if (!tab.contains(e.relatedTarget)) tab.classList.remove('drop-target');
  });
  tab.addEventListener('drop', (e) => {
    tab.classList.remove('drop-target');
    if (!dragState) return;
    e.preventDefault();
    copyImagesToRanking(dragState.ids, rid);
  });
}

async function copyImagesToRanking(imgIds, rid) {
  const recs = imgIds.filter(id => state.images[id]).map(imageRecord);
  if (recs.length === 0) return;
  const target = rankings.find(r => r.id === rid);
  try {
    // Pick ids that are free in the target ranking (ids are per-ranking).
    const imgPrefix = rankingPrefix(rid) + 'img:';
    let maxId = 0;
    for (const k of await dbGetKeys(prefixRange(imgPrefix))) {
      const m = /^id_(\d+)$/.exec(k.slice(imgPrefix.length));
      if (m) maxId = Math.max(maxId, +m[1]);
    }
    const newIds = recs.map((_, i) => 'id_' + (maxId + 1 + i));
    const layout = (await dbGet(layoutKey(rid))) || { name: '', ranked: [], pool: [] };
    for (let i = 0; i < recs.length; i++) await dbPut(imgKey(newIds[i], rid), recs[i]);
    const next = { ...layout, pool: [...(layout.pool || []), ...newIds] };
    if (Array.isArray(layout.tiers)) next.tierPool = [...(layout.tierPool || []), ...newIds];
    await dbPut(layoutKey(rid), next);
    const label = target && target.name.trim() ? `"${target.name.trim()}"` : 'Untitled';
    showToast(`Copied ${recs.length > 1 ? recs.length + ' images ' : ''}to ${label}`);
  } catch (e) {
    setSaveStatus('Copy failed: ' + e.message);
  }
}

function showActive() {
  syncNameInput();
  render();
  renderTabs();
}

async function switchRanking(rid) {
  if (rid === activeId) return;
  await flushLayout();
  await loadRanking(rid);
  showActive();
  saveMeta();
}

async function newRanking() {
  await flushLayout();
  const rid = newRankingId();
  await dbPut(layoutKey(rid), { name: '', ranked: [], pool: [] });
  rankings.push({ id: rid, name: '' });
  await loadRanking(rid);
  showActive();
  await saveMeta();
  document.getElementById('listName').focus();
}

// Copy every record of a ranking (layout + images) under a new ranking id,
// place the copy right after the original, and open it.
async function duplicateRanking(rid) {
  const src = rankings.find(x => x.id === rid);
  if (!src) return;
  await flushLayout();  // make sure the stored layout matches what's on screen
  const nid = newRankingId();
  const name = src.name.trim() ? `${src.name.trim()} (copy)` : '';
  setSaveStatus('Duplicating...');
  try {
    const oldPrefix = rankingPrefix(rid);
    const recs = await dbGetAll(prefixRange(oldPrefix));
    for (const k in recs) {
      const key = rankingPrefix(nid) + k.slice(oldPrefix.length);
      const value = key === layoutKey(nid) ? { ...recs[k], name } : recs[k];
      await dbPut(key, value);
    }
    if (!recs[layoutKey(rid)]) await dbPut(layoutKey(nid), { name, ranked: [], pool: [] });
  } catch (e) {
    await dbDelete(prefixRange(rankingPrefix(nid))).catch(() => {});
    setSaveStatus('Duplicate failed: ' + e.message);
    return;
  }
  setSaveStatus('');
  rankings.splice(rankings.indexOf(src) + 1, 0, { id: nid, name });
  await loadRanking(nid);
  showActive();
  await saveMeta();
  showToast('Ranking duplicated');
}

async function deleteRanking(rid) {
  const r = rankings.find(x => x.id === rid);
  if (!r) return;
  const label = r.name.trim() ? `"${r.name.trim()}"` : 'this untitled ranking';
  if (!confirm(`Delete ${label} and all its images? This cannot be undone.`)) return;
  if (rid === activeId) {
    clearTimeout(layoutSaveTimer);
    layoutSaveTimer = null;
  }
  const idx = rankings.indexOf(r);
  rankings.splice(idx, 1);
  try {
    await dbDelete(prefixRange(rankingPrefix(rid)));
  } catch (e) {
    setSaveStatus('Delete failed: ' + e.message);
  }
  if (rankings.length === 0) {
    const nid = newRankingId();
    await dbPut(layoutKey(nid), { name: '', ranked: [], pool: [] });
    rankings.push({ id: nid, name: '' });
  }
  if (rid === activeId) {
    await loadRanking(rankings[Math.min(idx, rankings.length - 1)].id);
    showActive();
  } else {
    renderTabs();
  }
  await saveMeta();
}

// True when the open ranking has nothing in it, so an import can replace it.
function activeIsBlank() {
  return !state.name.trim() && Object.keys(state.images).length === 0;
}

// ===== Rendering =====
// Cards are cached by image id so images are decoded once and reused across
// renders. Rebuilding them every move was slow and caused blank flashes while
// the browser re-decoded full-resolution images.
const cardCache = new Map(); // imgId -> card element

function getCard(imgId) {
  let card = cardCache.get(imgId);
  if (!card) {
    card = makeImageCard(imgId);
    if (card) cardCache.set(imgId, card);
  }
  return card;
}

function emptyMsg(text) {
  const empty = document.createElement('div');
  empty.className = 'rank-empty';
  empty.textContent = text;
  return empty;
}

function render() {
  const tier = state.mode === 'tier';
  document.body.classList.toggle('tier-mode', tier);
  document.getElementById('modeListBtn').classList.toggle('active', !tier);
  document.getElementById('modeTierBtn').classList.toggle('active', tier);
  if (tier) { renderTiers(); syncAutoColorBtn(); } else renderRanked();
  renderPool();
  syncSelection();  // also updates the image count
}

function updateImageCount() {
  const total = Object.keys(state.images).length;
  const unranked = currentPool().length;
  const placed = total - unranked;
  const hidden = Object.keys(state.images).filter(isHidden).length;
  const el = document.getElementById('imageCount');
  el.textContent = total === 0
    ? 'No images'
    : `${total} image${total === 1 ? '' : 's'} (${placed} ${state.mode === 'tier' ? 'tiered' : 'ranked'}, ${unranked} unranked)`
      + (hidden ? ` · ${hidden} hidden` : '')
      + (selected.size ? ` · ${selected.size} selected (Esc to clear)` : '');
}

// Empty-area message, noting when the area only looks empty because its
// images are in hidden groups.
function hiddenMsg(list, text) {
  const n = list.length;
  return emptyMsg(n ? `${n} image${n === 1 ? ' is' : 's are'} here, all in hidden groups.` : text);
}

// Tier rows are rebuilt on each render (the old rows and their listeners are
// discarded with them); the image cards inside are the cached ones.
// An inline-editable text field bound to tier[key]; Enter finishes editing.
function makeTierText(className, tier, key, title) {
  const el = document.createElement('div');
  el.className = className;
  // 'plaintext-only' blocks pasted formatting, but older browsers throw on it.
  try { el.contentEditable = 'plaintext-only'; } catch (e) { el.contentEditable = 'true'; }
  el.spellcheck = false;
  el.textContent = tier[key];
  el.title = title;
  el.addEventListener('input', () => {
    tier[key] = el.textContent;
    saveLayout();
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
  });
  // Normalize away a stray <br> some browsers leave behind, so :empty
  // (which shows the placeholder) works again after clearing the text.
  el.addEventListener('blur', () => { if (!el.textContent.trim()) el.textContent = ''; });
  return el;
}

function renderTiers() {
  const board = document.getElementById('tierBoard');
  board.replaceChildren();
  pruneBounds();
  state.tiers.forEach((tier, i) => {
    const row = document.createElement('div');
    row.className = 'tier-row';

    // Colored cell holding the tier's name and its optional description.
    const label = document.createElement('div');
    label.className = 'tier-label';
    label.style.background = tier.color;
    label.style.color = textColorFor(tier.color);
    label.appendChild(makeTierText('tier-name', tier, 'label', 'Click to rename this tier'));
    label.appendChild(makeTierText('tier-desc', tier, 'description',
      'Optional description of what this tier means'));
    // Dropping a card on the label adds it to the end of this tier (instead of
    // the browser pasting the card's id into the editable text).
    label.addEventListener('dragover', (e) => {
      if (!dragState) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    });
    label.addEventListener('drop', (e) => {
      if (!dragState) return;
      e.preventDefault();
      moveImages(dragState.ids, 'tier:' + tier.id, null);
    });
    row.appendChild(label);

    const items = document.createElement('div');
    items.className = 'rank-images tier-items';
    for (const imgId of visible(tier.items)) {
      const card = getCard(imgId);
      if (!card) continue;
      card._rankNum.style.display = 'none';
      setCardBound(card, imgId === tier.upper);
      setCardGroup(card, imgId);
      items.appendChild(card);
    }
    setupDropZone(items, 'tier:' + tier.id);
    row.appendChild(items);

    const controls = document.createElement('div');
    controls.className = 'tier-controls';
    const ctrl = (text, title, onClick, disabled) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.title = title;
      b.disabled = !!disabled;
      b.addEventListener('click', onClick);
      controls.appendChild(b);
    };
    ctrl('▲', 'Move tier up', () => moveTier(i, -1), i === 0);
    const color = document.createElement('input');
    color.type = 'color';
    color.value = tier.color;
    color.title = 'Tier color';
    color.addEventListener('input', () => {
      // A hand-picked color wins: stop auto-coloring so it isn't overwritten.
      if (state.tierAutoColor) {
        state.tierAutoColor = false;
        syncAutoColorBtn();
      }
      tier.color = color.value;
      label.style.background = tier.color;
      label.style.color = textColorFor(tier.color);
      saveLayout();
    });
    controls.appendChild(color);
    ctrl('×', 'Delete tier (its images go back to unranked)', () => deleteTier(i));
    ctrl('▼', 'Move tier down', () => moveTier(i, 1), i === state.tiers.length - 1);
    row.appendChild(controls);

    board.appendChild(row);
  });
}

function addTier() {
  const i = state.tiers.length;
  state.tiers.push({ id: newTierId(), label: nextTierLabel(), description: '', color: TIER_COLORS[i % TIER_COLORS.length], items: [] });
  tiersChanged();
}

function moveTier(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= state.tiers.length) return;
  [state.tiers[i], state.tiers[j]] = [state.tiers[j], state.tiers[i]];
  tiersChanged();
}

function deleteTier(i) {
  const [tier] = state.tiers.splice(i, 1);
  state.tierPool.unshift(...tier.items);
  tiersChanged();
}

function syncAutoColorBtn() {
  const btn = document.getElementById('autoColorBtn');
  btn.classList.toggle('active', !!state.tierAutoColor);
  btn.textContent = state.tierAutoColor ? 'Auto colors: on' : 'Auto colors: off';
}

function renderRanked() {
  const el = document.getElementById('ranked');
  el.replaceChildren();  // detaches cached cards without destroying them
  // Rank numbers count only the shown images, matching the export.
  const shown = visible(state.ranked);
  if (shown.length === 0) {
    el.appendChild(hiddenMsg(state.ranked, 'Drag images here to rank them. The number in each corner is its rank.'));
    return;
  }
  shown.forEach((imgId, i) => {
    const card = getCard(imgId);
    if (!card) return;
    card._rankNum.textContent = i + 1;
    card._rankNum.style.display = '';
    setCardBound(card, false);
    setCardGroup(card, imgId);
    el.appendChild(card);
  });
}

function renderPool() {
  const poolEl = document.getElementById('pool');
  poolEl.replaceChildren();
  const pool = currentPool();
  const shown = visible(pool);
  if (shown.length === 0) {
    poolEl.appendChild(hiddenMsg(pool, 'Drag images here, or click "+ Add Images" / drop image files anywhere on this page.'));
    return;
  }
  shown.forEach(imgId => {
    const card = getCard(imgId);
    if (!card) return;
    card._rankNum.style.display = 'none';
    setCardBound(card, false);
    setCardGroup(card, imgId);
    poolEl.appendChild(card);
  });
}

function makeImageCard(imgId) {
  const img = state.images[imgId];
  if (!img) return null;
  const card = document.createElement('div');
  card.className = 'img-card';
  card.draggable = true;
  card.dataset.imageId = imgId;
  card.title = img.name || '';
  const imgEl = document.createElement('img');
  imgEl.src = img.url;
  imgEl.draggable = false;
  imgEl.decoding = 'async';
  card.appendChild(imgEl);

  // Group color stripe along the bottom edge; set by the render pass.
  const stripe = document.createElement('div');
  stripe.className = 'group-stripe';
  stripe.style.display = 'none';
  card.appendChild(stripe);
  card._groupStripe = stripe;

  // Rank badge: always present, shown/hidden + numbered by the render pass.
  const num = document.createElement('div');
  num.className = 'rank-num';
  num.style.display = 'none';
  card.appendChild(num);
  card._rankNum = num;

  // Tier upper-bound tag + toggle button (only shown inside a tier row).
  const tag = document.createElement('div');
  tag.className = 'bound-tag';
  tag.textContent = '▲ Upper bound';
  tag.style.display = 'none';
  card.appendChild(tag);
  card._boundTag = tag;
  const boundBtn = document.createElement('button');
  boundBtn.className = 'bound-btn';
  boundBtn.textContent = '▲';
  boundBtn.title = 'Mark as this tier\'s upper bound (moves it to the front; click again to unmark)';
  boundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleBound(imgId);
  });
  card.appendChild(boundBtn);

  card.addEventListener('click', (e) => {
    if (e.target.closest('.img-bubble, button')) return;
    onCardClick(imgId, e);
  });

  card.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', imgId);
    e.dataTransfer.effectAllowed = 'copyMove';  // move within a ranking, copy onto another tab
    card.classList.add('dragging');
    const r = card.getBoundingClientRect();
    // Dragging a selected card carries the whole selection along.
    const ids = selected.has(imgId) && selected.size > 1 ? selectionInOrder() : [imgId];
    dragState = { imgId, ids, w: r.width, h: r.height, sourceCard: card };
    // Count badge, present only while the browser snapshots the drag image.
    let badge = null;
    if (ids.length > 1) {
      badge = document.createElement('div');
      badge.className = 'drag-count';
      badge.textContent = ids.length;
      card.appendChild(badge);
    }
    // Hide the dragged cards from layout (after the browser captures the drag image)
    setTimeout(() => {
      if (badge) badge.remove();
      if (!dragState || dragState.sourceCard !== card) return;
      for (const id of ids) {
        const c = cardCache.get(id);
        if (c) c.style.display = 'none';
      }
    }, 0);
  });
  card.addEventListener('dragend', () => {
    for (const id of dragState ? dragState.ids : [imgId]) {
      const c = cardCache.get(id);
      if (c) c.style.display = '';
    }
    card.style.display = '';
    card.classList.remove('dragging');
    removePlaceholder();
    dragState = null;
  });

  const rm = document.createElement('button');
  rm.className = 'remove';
  rm.textContent = '×';
  rm.title = 'Remove image';
  rm.addEventListener('click', (e) => {
    e.stopPropagation();
    removeImage(imgId);
  });
  card.appendChild(rm);

  const textBtn = document.createElement('button');
  textBtn.className = 'text-btn';
  textBtn.textContent = 'T';
  textBtn.title = img.annotation ? 'Edit text (clear to remove)' : 'Add text';
  textBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const fallback = stripExt(img.name || '');
    const current = img.annotation ? img.annotation.text : fallback;
    const next = prompt('Caption text (leave empty to remove):', current);
    if (next === null) return;  // cancelled
    if (next.trim() === '') {
      img.annotation = null;
    } else {
      img.annotation = img.annotation
        ? { ...img.annotation, text: next }
        : { text: next, x: 0.5, y: 0.85 };
    }
    cardCache.delete(imgId);  // rebuild so the caption bubble reflects the change
    render();
    saveImage(imgId);  // only this image's annotation changed
  });
  card.appendChild(textBtn);

  if (img.annotation) {
    const bubble = document.createElement('div');
    bubble.className = 'img-bubble';
    bubble.textContent = img.annotation.text;
    bubble.style.left = (img.annotation.x * 100) + '%';
    bubble.style.top = (img.annotation.y * 100) + '%';
    // Drag to reposition the bubble without triggering card drag
    bubble.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      card.draggable = false;
      const rect = card.getBoundingClientRect();
      const startX = e.clientX, startY = e.clientY;
      const initX = img.annotation.x, initY = img.annotation.y;
      const onMove = (ev) => {
        const nx = Math.max(0, Math.min(1, initX + (ev.clientX - startX) / rect.width));
        const ny = Math.max(0, Math.min(1, initY + (ev.clientY - startY) / rect.height));
        img.annotation.x = nx;
        img.annotation.y = ny;
        bubble.style.left = (nx * 100) + '%';
        bubble.style.top = (ny * 100) + '%';
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        card.draggable = true;
        saveImage(imgId);  // only this image's annotation position changed
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
    card.appendChild(bubble);
  }

  return card;
}

let dragState = null;       // { imgId, w, h, sourceCard }
let placeholderEl = null;

function ensurePlaceholder() {
  if (!placeholderEl) {
    placeholderEl = document.createElement('div');
    placeholderEl.className = 'drop-placeholder';
  }
  if (dragState) {
    placeholderEl.style.width = dragState.w + 'px';
    placeholderEl.style.height = dragState.h + 'px';
  }
  return placeholderEl;
}

function removePlaceholder() {
  if (placeholderEl && placeholderEl.parentNode) {
    placeholderEl.parentNode.removeChild(placeholderEl);
  }
}

// Find where the dragged item should land, based on the cursor position.
// Returns an index among the *visible* cards (the dragged card is hidden, so
// it's excluded) — which, after removing the dragged id from its list, is the
// correct splice index. Robust for a wrapping row of varying-width images:
// pick the card whose center is nearest the cursor, then go before/after it.
function computeInsertIndex(el, x, y) {
  const cards = [...el.children].filter(c =>
    c.classList && c.classList.contains('img-card') && c.style.display !== 'none');
  let index = cards.length;   // default: append at the end
  let bestDist = Infinity;
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const d = Math.hypot(x - cx, y - cy);
    if (d < bestDist) {
      bestDist = d;
      index = (x < cx) ? i : i + 1;
    }
  }
  return { index, cards };
}

function setupDropZone(el, target) {
  el.addEventListener('dragover', (e) => {
    if (!e.dataTransfer.types.includes('text/plain')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (!dragState) return;

    const ph = ensurePlaceholder();
    const { index, cards } = computeInsertIndex(el, e.clientX, e.clientY);
    const before = cards[index] || null;  // null = append
    if (before) {
      if (ph.nextSibling !== before) el.insertBefore(ph, before);
    } else {
      if (ph.parentNode !== el || ph.nextSibling !== null) el.appendChild(ph);
    }
  });

  el.addEventListener('dragleave', (e) => {
    // Remove the placeholder only when the cursor truly leaves this zone's
    // bounds. Geometry-based so it doesn't depend on relatedTarget (which is
    // often null mid-drag and caused the placeholder to vanish prematurely).
    const r = el.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX >= r.right ||
        e.clientY < r.top || e.clientY >= r.bottom) {
      removePlaceholder();
    }
  });

  el.addEventListener('drop', (e) => {
    const imgId = e.dataTransfer.getData('text/plain');
    if (!imgId || !state.images[imgId]) return;
    e.preventDefault();
    // Compute the index straight from the cursor position so it never depends
    // on the placeholder still being present in the DOM. All dragged cards are
    // hidden. Cards of hidden groups aren't on screen either, so land before
    // the card under the cursor by id rather than by position.
    const { index, cards } = computeInsertIndex(el, e.clientX, e.clientY);
    removePlaceholder();
    const ids = dragState && dragState.imgId === imgId ? dragState.ids : [imgId];
    moveImages(ids, target, cards[index] ? cards[index].dataset.imageId : null);
  });
}

// ===== Selection =====
// Click a card to select it (click again to deselect); shift-click selects
// the run between it and the last clicked card in the same row. Dragging any
// selected card moves the whole selection.
const selected = new Set();
let selectAnchor = null;

function syncSelection() {
  for (const [id, card] of cardCache) card.classList.toggle('selected', selected.has(id));
  updateImageCount();
  renderGroupBar();  // its buttons depend on the selection
}

function clearSelection() {
  selectAnchor = null;
  if (!selected.size) return;
  selected.clear();
  syncSelection();
}

function onCardClick(imgId, e) {
  if (e.shiftKey && selectAnchor && selectAnchor !== imgId) {
    const found = modeLists().find(l => l.includes(imgId));
    const list = found && visible(found);
    if (list && list.includes(selectAnchor)) {
      const [a, b] = [list.indexOf(selectAnchor), list.indexOf(imgId)].sort((x, y) => x - y);
      for (const id of list.slice(a, b + 1)) selected.add(id);
      syncSelection();
      return;
    }
  }
  if (selected.has(imgId)) selected.delete(imgId); else selected.add(imgId);
  selectAnchor = imgId;
  syncSelection();
}

// Selected ids in on-screen order (tier by tier, or ranked then unranked).
function selectionInOrder() {
  return modeLists().flat().filter(id => selected.has(id));
}

// Box selection: press on empty space in the page and drag a rectangle; every
// card it touches is selected. With Shift/⌘/Ctrl held it adds to the current
// selection. A plain click on empty space (no drag) clears the selection.
// The box is tracked in document coordinates so scrolling mid-drag works.
const MARQUEE_SKIP = '.img-card, button, input, label, [contenteditable], .tier-label, .tier-controls, .group-bar';
document.querySelector('main').addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || e.pointerType === 'touch' || e.target.closest(MARQUEE_SKIP)) return;
  e.preventDefault();  // no text selection while dragging the box
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  const additive = e.shiftKey || e.metaKey || e.ctrlKey;
  const base = additive ? new Set(selected) : new Set();
  const start = { x: e.clientX + scrollX, y: e.clientY + scrollY };
  let last = { x: e.clientX, y: e.clientY };
  let box = null;

  const update = () => {
    const cur = { x: last.x + scrollX, y: last.y + scrollY };
    const left = Math.min(start.x, cur.x), top = Math.min(start.y, cur.y);
    const right = Math.max(start.x, cur.x), bottom = Math.max(start.y, cur.y);
    if (!box) {
      if (right - left < 4 && bottom - top < 4) return;  // still just a click
      box = document.createElement('div');
      box.className = 'marquee';
      document.body.appendChild(box);
      document.body.classList.add('marquee-active');
    }
    Object.assign(box.style, {
      left: left + 'px', top: top + 'px',
      width: (right - left) + 'px', height: (bottom - top) + 'px',
    });
    selected.clear();
    for (const id of base) selected.add(id);
    for (const id of modeLists().flat()) {
      const card = cardCache.get(id);
      if (!card || !card.isConnected) continue;
      const r = card.getBoundingClientRect();
      if (r.right + scrollX > left && r.left + scrollX < right &&
          r.bottom + scrollY > top && r.top + scrollY < bottom) selected.add(id);
    }
    syncSelection();
  };
  const onMove = (ev) => {
    last = { x: ev.clientX, y: ev.clientY };
    // Nudge the page when the box reaches the top/bottom edge of the window.
    if (ev.clientY < 40) scrollBy(0, -20);
    else if (ev.clientY > innerHeight - 40) scrollBy(0, 20);
    update();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('scroll', update);
    document.body.classList.remove('marquee-active');
    if (box) box.remove();
    else if (!additive) clearSelection();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('scroll', update);
});

// ===== Operations =====
function currentPool() {
  return state.mode === 'tier' ? state.tierPool : state.pool;
}

// The lists making up the current mode's arrangement.
function modeLists() {
  return state.mode === 'tier'
    ? [...state.tiers.map(t => t.items), state.tierPool]
    : [state.ranked, state.pool];
}

// target: 'ranked', 'pool' (the current mode's pool) or 'tier:<tierId>'.
function listFor(target) {
  if (target === 'ranked') return state.ranked;
  if (target === 'pool') return currentPool();
  const tier = (state.tiers || []).find(t => 'tier:' + t.id === target);
  return tier ? tier.items : null;
}

function removeFrom(lists, imgId) {
  for (const list of lists) {
    const i = list.indexOf(imgId);
    if (i !== -1) { list.splice(i, 1); return; }
  }
}

// Move one or more images (kept in the given order) to target, just before
// the image beforeId (null = at the end).
function moveImages(ids, target, beforeId) {
  const list = listFor(target);
  if (!list) return;
  const lists = modeLists();
  for (const id of ids) removeFrom(lists, id);
  const idx = beforeId ? list.indexOf(beforeId) : -1;
  list.splice(idx === -1 ? list.length : idx, 0, ...ids);
  if (ids.length > 1) clearSelection();  // a group move is done; start fresh
  render();
  saveLayout();  // only the ordering changed
}

function removeImage(imgId) {
  selected.delete(imgId);
  delete state.groupOf[imgId];
  removeFrom([state.ranked, state.pool], imgId);
  if (state.tiers) removeFrom([...state.tiers.map(t => t.items), state.tierPool], imgId);
  const img = state.images[imgId];
  if (img && img.url) URL.revokeObjectURL(img.url);
  delete state.images[imgId];
  cardCache.delete(imgId);
  render();
  deleteImageRecord(imgId);
  saveLayout();
}

async function addFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith('image/'));
  if (imgs.length === 0) return;
  const newIds = [];
  for (const file of imgs) {
    const id = newId();
    const blob = file;
    state.images[id] = { blob, name: file.name, url: URL.createObjectURL(blob) };
    state.pool.push(id);
    if (state.tiers) state.tierPool.push(id);
    newIds.push(id);
  }
  render();
  saveLayout();
  // Capture keys + records now so switching tabs mid-save can't misfile them.
  const pending = newIds.map(id => [imgKey(id), imageRecord(id)]);
  setSaveStatus('Saving...');
  try {
    for (const [key, rec] of pending) await dbPut(key, rec);
    setSaveStatus('Saved');
    setTimeout(() => setSaveStatus(''), 1200);
  } catch (e) {
    setSaveStatus('Save failed: ' + e.message);
  }
  showToast(`Added ${imgs.length} image${imgs.length === 1 ? '' : 's'}`);
}

// ===== Export to JPG =====
async function loadImageFromUrl(url) {
  const im = new Image();
  im.src = url;
  // decode() resolves only once the bitmap is ready to paint. Relying on
  // onload alone let drawImage run before some images finished decoding, so
  // their pixels came out blank on the canvas (the later images in a big batch).
  try {
    await im.decode();
  } catch (e) {
    // Some browsers can reject decode() spuriously; fall back to onload.
    await new Promise((resolve, reject) => {
      if (im.complete && im.naturalWidth) return resolve();
      im.onload = () => resolve();
      im.onerror = reject;
    });
  }
  return im;
}

function stripExt(name) {
  const i = name.lastIndexOf('.');
  return i > 0 ? name.slice(0, i) : name;
}

function drawBubble(ctx, ann, ix, iy, iw, ih) {
  const fontPx = Math.max(14, Math.round(ih * 0.08));
  const padX = Math.round(fontPx * 0.7);
  const padY = Math.round(fontPx * 0.35);
  const radius = Math.round(fontPx * 0.7);
  ctx.save();
  ctx.font = `600 ${fontPx}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const maxTextW = iw - padX * 2 - 8;
  const lines = wrapText(ctx, ann.text, maxTextW);
  const lineH = fontPx * 1.2;
  const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const boxW = textW + padX * 2;
  const boxH = lines.length * lineH + padY * 2;
  let cx = ix + ann.x * iw;
  let cy = iy + ann.y * ih;
  // Keep bubble within image bounds
  cx = Math.max(ix + boxW / 2, Math.min(ix + iw - boxW / 2, cx));
  cy = Math.max(iy + boxH / 2, Math.min(iy + ih - boxH / 2, cy));
  const bx = cx - boxW / 2, by = cy - boxH / 2;
  // Bubble background
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  roundRect(ctx, bx, by, boxW, boxH, radius);
  ctx.fill();
  // Text
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 2;
  ctx.shadowOffsetY = 1;
  const textStartY = cy - (lines.length - 1) * lineH / 2;
  lines.forEach((line, li) => {
    ctx.fillText(line, cx, textStartY + li * lineH);
  });
  ctx.restore();
}

function drawRankNum(ctx, n, ix, iy, ih) {
  const fontPx = Math.max(12, Math.round(ih * 0.09));
  const padX = Math.round(fontPx * 0.45);
  const boxH = Math.round(fontPx * 1.5);
  ctx.save();
  ctx.font = `700 ${fontPx}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;
  const textW = ctx.measureText(String(n)).width;
  const boxW = Math.max(boxH, textW + padX * 2);
  // Badge background, anchored top-left, with rounded bottom-right corner
  ctx.fillStyle = '#4a9eff';
  ctx.beginPath();
  const r = Math.round(fontPx * 0.4);
  ctx.moveTo(ix, iy);
  ctx.lineTo(ix + boxW, iy);
  ctx.lineTo(ix + boxW, iy + boxH - r);
  ctx.arcTo(ix + boxW, iy + boxH, ix + boxW - r, iy + boxH, r);
  ctx.lineTo(ix, iy + boxH);
  ctx.closePath();
  ctx.fill();
  // Number
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 2;
  ctx.shadowOffsetY = 1;
  ctx.fillText(String(n), ix + boxW / 2, iy + boxH / 2 + 1);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(ctx, text, maxW) {
  const words = text.split(/\s+/).filter(Boolean);
  if (words.length === 0) return [''];
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW) {
      cur = test;
    } else {
      if (cur) lines.push(cur);
      cur = w;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

// Title band drawn across the top of the export, centered over the image rows.
function titleFont(fontPx) {
  return `700 ${fontPx}px -apple-system, BlinkMacSystemFont, Arial, sans-serif`;
}

function drawTitle(ctx, lines, totalW, top, fontPx) {
  ctx.save();
  ctx.font = titleFont(fontPx);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e8e8e8';
  const lineH = fontPx * 1.35;
  lines.forEach((line, i) => {
    ctx.fillText(line, totalW / 2, top + lineH * i + lineH / 2);
  });
  ctx.restore();
}

// Number of top-ranked images to export; 0 means all.
function exportLimit() {
  const n = parseInt(document.getElementById('exportLimit').value, 10);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

// Requested export width/height in pixels; 0 means unconstrained.
function exportDim(inputId) {
  const n = parseInt(document.getElementById(inputId).value, 10);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

// Resample a finished canvas to fit within wantW × wantH (either may be 0 for
// "no limit"), keeping its aspect ratio. Large downscales go in halving steps
// so the result stays sharp instead of aliased.
function resizeCanvas(src, wantW, wantH, maxSide, maxArea) {
  const k = Math.min(wantW ? wantW / src.width : Infinity,
                     wantH ? wantH / src.height : Infinity);
  let targetW = Math.max(1, Math.round(src.width * k));
  let targetH = Math.max(1, Math.round(src.height * k));
  // Clamp to the browser canvas limits if a huge size was requested.
  const fit = Math.min(maxSide / targetW, maxSide / targetH,
                       Math.sqrt(maxArea / (targetW * targetH)), 1);
  if (fit < 1) {
    targetW = Math.max(1, Math.floor(targetW * fit));
    targetH = Math.max(1, Math.floor(targetH * fit));
  }
  if (targetW === src.width && targetH === src.height) return src;
  let cur = src;
  while (cur.width / 2 >= targetW) {
    const half = document.createElement('canvas');
    half.width = Math.max(targetW, Math.round(cur.width / 2));
    half.height = Math.max(targetH, Math.round(cur.height / 2));
    const hctx = half.getContext('2d');
    hctx.imageSmoothingEnabled = true;
    hctx.imageSmoothingQuality = 'high';
    hctx.drawImage(cur, 0, 0, half.width, half.height);
    if (cur !== src) cur.width = cur.height = 0;  // free the intermediate
    cur = half;
  }
  if (cur.width === targetW && cur.height === targetH) return cur;
  const out = document.createElement('canvas');
  out.width = targetW;
  out.height = targetH;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(cur, 0, 0, targetW, targetH);
  if (cur !== src) cur.width = cur.height = 0;
  return out;
}

// Safari caps canvas at ~16384px per side and ~16384² area; stay well under.
const EXPORT_MAX_SIDE = 14000;
const EXPORT_MAX_AREA = 200_000_000;
const EXPORT_PAD = 8;
const EXPORT_BG = '#1a1a1a';

// Measure each image one at a time (decode then immediately release) so we
// never hold 80 full-resolution bitmaps in memory at once. The actual pixels
// are decoded again, streamed, during the draw pass.
async function measureDims(ids) {
  const dims = {};
  for (const id of ids) {
    const bmp = await createImageBitmap(state.images[id].blob);
    dims[id] = { w: bmp.width, h: bmp.height };
    bmp.close();
  }
  return dims;
}

// Scaled width of each image at row height targetH.
function scaledWidths(ids, dims, targetH) {
  const sW = {};
  for (const id of ids) sW[id] = Math.round(dims[id].w * (targetH / dims[id].h));
  return sW;
}

// Wrap images onto multiple lines when they exceed maxLineW. Each line's
// width includes PAD before every image and after the last one.
function packLines(ids, sW, maxLineW) {
  const PAD = EXPORT_PAD;
  const lines = [];
  let cur = [];
  let curW = PAD;
  for (const id of ids) {
    const iw = sW[id];
    if (cur.length > 0 && curW + iw + PAD > maxLineW) {
      lines.push({ images: cur, width: curW });
      cur = []; curW = PAD;
    }
    cur.push(id);
    curW += iw + PAD;
  }
  if (cur.length > 0) lines.push({ images: cur, width: curW });
  return lines;
}

// Title band: sized off the row height and wrapped to the image width, so a
// long title never widens the canvas past the images themselves.
function titleLayout(title, targetH, totalW, measureCtx) {
  if (!title) return { titleFontPx: 0, titleBandH: 0, titleLines: [] };
  const PAD = EXPORT_PAD;
  let titleFontPx = Math.max(20, Math.round(targetH * 0.16));
  const maxTitleW = Math.max(200, totalW - PAD * 4);
  measureCtx.font = titleFont(titleFontPx);
  // Only an unbreakable word forces a smaller font; the rest just wraps.
  const longestWord = Math.max(...title.split(/\s+/).filter(Boolean)
    .map(w => measureCtx.measureText(w).width));
